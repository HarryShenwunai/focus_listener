name: Bug report
description: Report a reproducible Focus Listener Portable Beta problem without classroom content.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, audio, transcripts, questions, evidence, or personal information."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 10, Windows 11]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or non-sensitive descriptions only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed keys, classroom content, and personal information.
          required: true
